<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta name="description" content="Sign in to the POS AVNT client dashboard." />
    <title>Client Login — POS AVNT</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23000'/%3E%3Cpath d='M7 24 14.1 8h3.8L25 24h-4.5l-1.2-3H12.7l-1.2 3H7Zm7-6.8h4l-2-5.1-2 5.1Z' fill='%23a855f7'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; --violet: #753ce7; --ink: #16131d; --muted: #77737f; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100svh; background: #000; color: #fff; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
      a { color: inherit; text-decoration: none; }
      .page-header { height: 112px; width: min(1120px, calc(100% - 64px)); margin: auto; display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; }
      .back-link { justify-self: start; color: #8f8b96; font-size: .75rem; display: inline-flex; align-items: center; gap: 8px; }
      .back-link:hover { color: #fff; }
      .brand { font-size: 1.65rem; letter-spacing: .18em; font-weight: 850; line-height: 1; }
      main { width: min(1040px, calc(100% - 64px)); margin: 22px auto 72px; }
      .login-layout { display: grid; grid-template-columns: 1.12fr 1fr; min-height: 620px; overflow: hidden; border-radius: 28px; border: 1px solid #26222c; box-shadow: 0 24px 100px #12092155; }
      .art-panel { position: relative; min-width: 0; background: #08060d; overflow: hidden; }
      .art-panel img { display: block; width: 100%; height: 100%; position: absolute; inset: 0; object-fit: cover; object-position: center 45%; }
      .art-panel::after { content: ""; position: absolute; inset: 62% 0 0; background: linear-gradient(transparent, #050307cf); pointer-events: none; }
      .art-caption { position: absolute; z-index: 1; left: 38px; right: 30px; bottom: 32px; margin: 0; color: #fff; font-size: clamp(1.4rem, 2.5vw, 2rem); font-weight: 650; line-height: 1.15; letter-spacing: -.045em; }
      .art-caption span { color: #c5bfce; }
      .login-panel { color-scheme: light; background: #fff; color: var(--ink); padding: 58px 54px 44px; display: flex; flex-direction: column; justify-content: center; }
      .login-mark { width: 45px; height: 45px; color: var(--violet); margin-bottom: 32px; }
      h1 { font-size: 2.05rem; font-weight: 700; line-height: 1.1; letter-spacing: -.05em; margin: 0 0 10px; }
      .intro { margin: 0 0 33px; font-size: .85rem; line-height: 1.6; color: var(--muted); }
      label { display: block; margin-top: 22px; }
      .field-label { display: block; font-size: .71rem; font-weight: 650; color: #5d5766; margin-bottom: 4px; }
      .input-wrap { display: flex; align-items: center; gap: 11px; border-bottom: 1px solid #d7d3de; transition: border-color .18s; }
      .input-wrap:focus-within { border-color: var(--violet); }
      .field-icon { width: 17px; height: 17px; color: #918a9c; flex: none; }
      input { width: 100%; min-width: 0; border: 0; border-radius: 0; background: transparent; color: var(--ink); padding: 13px 0; font: inherit; font-size: .86rem; outline: none; }
      input::placeholder { color: #aaa4b2; }
      .form-meta { display: flex; justify-content: flex-end; margin: 18px 0 30px; }
      .form-meta a { font-size: .73rem; font-weight: 550; color: var(--violet); }
      .form-meta a:hover { text-decoration: underline; }
      .login-button { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 49px; border: 0; border-radius: 999px; padding: 14px 20px; color: #fff; background: var(--violet); font: inherit; font-weight: 650; font-size: .82rem; cursor: pointer; transition: background .18s; }
      .login-button:hover { background: #6430cc; }
      .login-button:disabled { opacity: .65; cursor: wait; }
      a:focus-visible, button:focus-visible { outline: 3px solid #ad8aef; outline-offset: 5px; }
      #loginMessage { font-size: .8rem; line-height: 1.5; margin: 0 0 18px; }
      .panel-footer { margin: 32px 0 0; text-align: center; font-size: .65rem; letter-spacing: .2em; font-weight: 750; color: #aaa3b3; }
      @media (min-height: 880px) and (min-width: 781px) { main { margin-top: clamp(22px, 6vh, 80px); } }
      @media (max-width: 1000px) { .login-panel { padding: 42px 36px; } .login-layout { min-height: 580px; } }
      @media (max-width: 780px) { .page-header { height: 88px; width: calc(100% - 40px); } .brand { font-size: 1.35rem; } .back-link { font-size: .7rem; } main { width: min(480px, calc(100% - 40px)); margin: 10px auto 40px; } .login-layout { grid-template-columns: 1fr; min-height: 0; border-radius: 24px; } .art-panel { height: 230px; } .art-panel img { object-position: center 28%; } .art-panel::after { inset: 30% 0 0; } .art-caption { left: 28px; bottom: 22px; font-size: 1.5rem; } .login-panel { padding: 32px 32px 28px; } .login-mark { width: 32px; height: 32px; margin-bottom: 20px; } h1 { font-size: 1.8rem; } .intro { margin-bottom: 22px; } .panel-footer { margin-top: 25px; } }
      @media (max-width: 780px) { .art-panel img { object-position: center top; } }
      @media (max-width: 380px) { .page-header { width: calc(100% - 28px); } main { width: calc(100% - 28px); } .login-panel { padding-inline: 25px; } .back-link span { display: none; } }
    </style>
  </head>
  <body>
    <header class="page-header">
      <a class="back-link" href="index.html" aria-label="Back to AVNT home">← <span>Back to home</span></a>
      <a class="brand" href="index.html" aria-label="AVNT home">AVNT</a>
    </header>
    <main>
      <div class="login-layout">
        <section class="art-panel" aria-label="AVNT nightlife">
          <img src="./assets/avnt-login-chrome-coupe.png" alt="Sculptural chrome cocktail glass reflecting violet light" width="1120" height="1400" fetchpriority="high" />
          <p class="art-caption">Run the night.<br /><span>From anywhere.</span></p>
        </section>
        <section class="login-panel" aria-labelledby="form-title">
          <svg class="login-mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M7 24 14.1 8h3.8L25 24h-4.5l-1.2-3H12.7l-1.2 3H7Zm7-6.8h4l-2-5.1-2 5.1Z" fill="currentColor" /></svg>
          <h1 id="form-title">Client login</h1>
          <p class="intro">Welcome back. Your night starts here.</p>
          <form id="loginForm">
            <label><span class="field-label">Email address</span><span class="input-wrap"><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg><input id="loginEmail" type="email" autocomplete="username" placeholder="you@yourvenue.com" required /></span></label>
            <label><span class="field-label">Password</span><span class="input-wrap"><svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><rect x="5" y="10" width="14" height="11" rx="3"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg><input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required /></span></label>
            <div class="form-meta"><a id="resetPassword" href="#">Forgot password?</a></div>
            <p id="loginMessage" role="alert" hidden></p>
            <button class="login-button" id="loginSubmit" type="submit">Log in →</button>
          </form>
          <p class="panel-footer">AVNT</p>
        </section>
      </div>
    </main>
    <script type="module" src="./login.js"></script>
  </body>
</html>
