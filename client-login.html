<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050505" />
    <meta name="description" content="Sign in to the POS AVNT client dashboard." />
    <title>Client Login — POS AVNT</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23050505'/%3E%3Cpath d='M7 24 14.1 8h3.8L25 24h-4.5l-1.2-3H12.7l-1.2 3H7Zm7-6.8h4l-2-5.1-2 5.1Z' fill='%23a855f7'/%3E%3C/svg%3E" />
    <style>
      :root { color-scheme: dark; --bg: #000; --card: #000; --line: #2b2b30; --text: #f7f7f8; --muted: #92929b; --purple: #a447f5; --blue: #2968df; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; background: var(--bg); color: var(--text); font-family: Inter, ui-rounded, "SF Pro Display", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
      a { color: inherit; text-decoration: none; }
      .login-header { position: relative; z-index: 2; height: 82px; padding: 0 clamp(22px,4vw,64px); border-bottom: 1px solid #1b1b1d; display: flex; align-items: center; justify-content: space-between; }
      .brand { font-size: 1.05rem; font-weight: 900; letter-spacing: .14em; }
      .back-link { color: var(--muted); font-size: .82rem; font-weight: 700; }
      .back-link:hover { color: #fff; }
      main { position: relative; z-index: 1; min-height: calc(100vh - 82px); display: grid; grid-template-columns: minmax(0,1fr) minmax(390px,520px); align-items: center; gap: clamp(50px,9vw,140px); width: min(1180px,calc(100% - 44px)); margin: auto; padding: 70px 0; }
      h1 { max-width: 620px; margin: 18px 0 22px; font-size: clamp(3.2rem,7vw,6.5rem); line-height: .92; letter-spacing: -.065em; }
      h1 span { display: block; color: transparent; background: linear-gradient(100deg,var(--purple),#7775ff,var(--blue)); background-clip: text; -webkit-background-clip: text; }
      .intro > p { max-width: 500px; color: var(--muted); font-size: 1rem; line-height: 1.65; }
      .login-card { padding: clamp(25px,4vw,38px); border: 1px solid var(--line); border-radius: 28px; background: var(--card); }
      .login-card h2 { margin: 0; font-size: 1.9rem; letter-spacing: -.04em; }
      .login-card > p { margin: 9px 0 26px; color: var(--muted); font-size: .88rem; line-height: 1.5; }
      label { display: grid; gap: 8px; margin-top: 16px; color: #d7d7dc; font-size: .78rem; font-weight: 750; }
      input { width: 100%; border: 1px solid #35353a; border-radius: 13px; outline: 0; background: #1c1c20; color: white; padding: 14px 15px; font: inherit; }
      input:focus { border-color: var(--purple); box-shadow: 0 0 0 3px rgba(164,71,245,.14); }
      .form-meta { display: flex; justify-content: flex-end; margin: 15px 0 22px; color: var(--muted); font-size: .75rem; }
      .form-meta a { color: #c781ff; }
      .login-button { width: 100%; border: 0; border-radius: 13px; background: white; color: #111; padding: 14px 18px; font: inherit; font-weight: 900; cursor: pointer; transition: transform .18s, box-shadow .18s; }
      .login-button:hover { transform: translateY(-1px); box-shadow: 0 12px 30px rgba(255,255,255,.11); }
      .preview-note { display: flex; gap: 11px; margin-top: 21px; padding: 14px; border: 1px solid #402d50; border-radius: 14px; background: #211928; color: #c98dff; }
      .preview-note i { flex: none; width: 8px; height: 8px; margin-top: 5px; border-radius: 50%; background: #ffb43b; }
      .preview-note p { display: grid; gap: 4px; margin: 0; font-size: .76rem; line-height: 1.4; }
      .preview-note small { color: #aa9eb2; }
      @media (max-width: 850px) { main { grid-template-columns: 1fr; width: min(560px,calc(100% - 40px)); gap: 38px; padding: 52px 0; } h1 { font-size: clamp(3rem,15vw,5rem); } .intro > p { display: none; } }
      @media (max-width: 520px) { .login-header { height: 70px; } main { min-height: calc(100vh - 70px); padding: 35px 0; } .intro { text-align: center; } .login-card { border-radius: 22px; } }
    </style>
  </head>
  <body>
    <header class="login-header">
      <a class="brand" href="index.html">AVNT</a>
      <a class="back-link" href="index.html">← Back to posavnt.com</a>
    </header>
    <main>
      <section class="intro" aria-labelledby="login-title">
        <h1 id="login-title">Run the night.<span>From anywhere.</span></h1>
        <p>See sales, manage your menu and nights, and update venue settings—even when you’re away from the POS.</p>
      </section>
      <section class="login-card" aria-labelledby="form-title">
        <h2 id="form-title">Client login</h2>
        <p>Enter your venue account details to continue.</p>
        <form id="loginForm">
          <label>Email address<input id="loginEmail" type="email" autocomplete="username" placeholder="you@yourvenue.com" required /></label>
          <label>Password<input id="loginPassword" type="password" autocomplete="current-password" placeholder="Enter your password" required /></label>
          <div class="form-meta"><a id="resetPassword" href="#">Reset password</a></div>
          <p id="loginMessage" role="alert" hidden style="font-size:.85rem;line-height:1.5"></p>
          <button class="login-button" id="loginSubmit" type="submit">Continue to dashboard →</button>
        </form>
      </section>
    </main>
    <script type="module" src="./login.js"></script>
  </body>
</html>
